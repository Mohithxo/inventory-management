<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>Inventory Management System</h1>
      <p class="header-sub">Track and manage your purchased items</p>
    </div>
  </header>

  <div class="container">

    <!-- Add Purchase Form -->
    <div class="card">
      <div class="card-header">
        <div>
          <h2>Add New Purchase</h2>
          <p class="card-sub">You can add multiple items in a single purchase</p>
        </div>
      </div>
      <form id="purchaseForm" novalidate>
        <div id="itemRows" class="item-rows-container"></div>
        <div class="form-actions">
          <button type="button" id="addItemBtn" class="btn btn-outline">+ Add Another Item</button>
          <button type="submit" id="submitBtn" class="btn btn-primary">Submit Purchase</button>
        </div>
      </form>
    </div>

    <!-- Items Table -->
    <div class="card">
      <div class="card-header">
        <h2>Item Inventory</h2>
        <button id="refreshBtn" class="btn btn-outline btn-sm">&#8635; Refresh</button>
      </div>
      <div class="table-wrapper">
        <table id="itemsTable">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Item Name</th>
              <th>Item Type</th>
              <th>Purchase Date</th>
              <th>Stock Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="itemsTableBody">
            <tr><td colspan="6" class="state-cell">Loading items...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Edit Item</h3>
        <button class="modal-close" id="closeModal" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="editForm" novalidate>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="form-group">
            <label for="editName">Item Name <span class="req">*</span></label>
            <input type="text" id="editName" required placeholder="Enter item name" class="form-control">
          </div>
          <div class="form-group">
            <label for="editType">Item Type <span class="req">*</span></label>
            <select id="editType" required class="form-control">
              <option value="">Select type...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editDate">Purchase Date <span class="req">*</span></label>
            <input type="date" id="editDate" required class="form-control">
          </div>
          <div class="form-group">
            <label class="checkbox-wrap">
              <input type="checkbox" id="editStock">
              <span class="checkbox-label">Stock Available</span>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelEdit" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden" role="alert"></div>

  <script src="script.js"></script>
</body>
</html>
